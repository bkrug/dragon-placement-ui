<h2>Dragon Form</h2>

<div class="card flex justify-center">
  <form [formGroup]="dragonFormGroup" (ngSubmit)="onSubmit()">
    <app-local-input-field id="given-name" label="Given Name:" fieldName="givenName" [formGroup]="this.dragonFormGroup" [fieldControl]="this.dragonFormGroup.get('givenName')" />
    <app-local-input-field id="family-name" label="Family Name:" fieldName="familyName" [formGroup]="this.dragonFormGroup" [fieldControl]="this.dragonFormGroup.get('familyName')" />
    <button type="submit" [disabled]="!dragonFormGroup.valid">Submit</button>
  </form>
</div>
