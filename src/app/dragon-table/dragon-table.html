<p-table
  [value]="dragons()"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [first]="this.first()"
  [rows]="this.pageSize"
  [rowsPerPageOptions]="[20]"
  [totalRecords]="totalRecords()"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
  [showLoader]="true"
  [lazy]="true"
  (onLazyLoad)="onPageChange($event)"
  [(selection)]="selectedDragon"
  [selectionMode]="'single'"
  >
  <ng-template #header>
    <tr>
      <th [style.display]="dragonTableType() === '2' ? 'none' : null"></th>
      <th>Name</th>
      <th>Breath Fire</th>
      <th>Passengers</th>
      <th>Fighting Skills</th>
      <th>Weight (kg)</th>
      <th>Length (m)</th>
      <th [style.display]="dragonTableType() === '1' ? 'none' : null"></th>
    </tr>
  </ng-template>
  <ng-template #body let-dragon>
    <tr [pSelectableRow]="dragon">
      <td [style.display]="dragonTableType() === '2' ? 'none' : null">
        <p-button (click)="assignDragon(dragon.dragonId)">Assign</p-button>
      </td>
      <td>{{ dragon.givenName }} {{ dragon.familyName }}</td>
      <td>{{ dragon.canBreathFire ? "yes" : "no" }}</td>
      <td>{{ dragon.canTakePassengers ? "yes" : "no" }}</td>
      <td>{{ dragon.fightingSkills }}</td>
      <td>{{ dragon.weightInKg }}</td>
      <td>{{ dragon.lengthInMeters }}</td>
      <td [style.display]="dragonTableType() === '1' ? 'none' : null">
        <p-button (click)="unassignDragon(dragon.dragonId)">Unassign</p-button>
      </td>
    </tr>
  </ng-template>
</p-table>
