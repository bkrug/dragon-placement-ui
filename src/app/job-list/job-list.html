@if (selectedJob() === null)
{
    <p-table
        [value]="jobs()"
        [tableStyle]="{ 'min-width': '50rem' }"
        [paginator]="true"
        [rows]="this.pageSize"
        [rowsPerPageOptions]="[20]"
        [totalRecords]="totalRecords()"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
        [showLoader]="true"
        [lazy]="true"
        (onLazyLoad)="onPageChange($event)"
        [(selection)]="selectedJob"
        [selectionMode]="'single'"
        >
        <ng-template #header>
            <tr>
                <th>Job Title</th>
                <th>Employer Name</th>
                <th>Positions to Fill</th>
                <th>Start Date</th>
                <th>End Date</th>
            </tr>
        </ng-template>
        <ng-template #body let-job>
            <tr [pSelectableRow]="job">
                <td>{{ job.jobTitle }}</td>
                <td>{{ job.employerName }}</td>
                <td>{{ job.openDescription }}</td>
                <td>{{ job.startDate | date:'fullDate':'+0' }}</td>
                <td>{{ job.endDate | date:'fullDate':'+0' }}</td>
            </tr>
        </ng-template>
    </p-table>
}
@else {
    <app-manage-job [selectedJob]="selectedJob()" (onClose)="selectedJob.set(null)" />
}
