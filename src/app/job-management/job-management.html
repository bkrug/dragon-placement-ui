<p>job-management works!</p>
<p-table
    [value]="jobs()"
    [tableStyle]="{ 'min-width': '50rem' }"
    [paginator]="true"
    [rows]="this.pageSize"
    [rowsPerPageOptions]="[20]"
    [totalRecords]="totalRecords()"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showLoader]="true"
    [lazy]="true"
    (onLazyLoad)="onPageChange($event)"
    >
    <ng-template #header>
        <tr>
            <th>Job Title</th>
            <th>Employer Name</th>
            <th>Number of Positions</th>
            <th>Start Date</th>
            <th>End Date</th>
        </tr>
    </ng-template>
    <ng-template #body let-job>
        <tr>
            <td><a href="#">{{ job.jobTitle }}</a></td>
            <td>{{ job.employerName }}</td>
            <td>{{ job.numberOfPositions }}</td>
            <td>{{ job.startDate }}</td>
            <td>{{ job.endDate }}</td>
        </tr>
    </ng-template>
</p-table>
