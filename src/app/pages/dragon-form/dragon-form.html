<h2>Dragon Form</h2>

<div class="card flex justify-center">
  <form [formGroup]="dragonFormGroup()" (ngSubmit)="onSubmit()" (focusin)="onFormFocus()">
    <app-local-text-field id="given-name" label="Given Name:" fieldName="givenName" [formGroup]="dragonFormGroup()" [fieldControl]="dragonFormGroup().get('givenName')" />
    <app-local-text-field id="family-name" label="Family Name:" fieldName="familyName" [formGroup]="dragonFormGroup()" [fieldControl]="dragonFormGroup().get('familyName')" />
    <app-local-checkbox id="can-breath-fire" label="Can Breath Fire:" fieldName="canBreathFire" [formGroup]="dragonFormGroup()" [fieldControl]="dragonFormGroup().get('canBreathFire')" />
    <app-local-checkbox id="can-take-passengers" label="Can Take Passengers:" fieldName="canTakePassengers" [formGroup]="dragonFormGroup()" [fieldControl]="dragonFormGroup().get('canTakePassengers')" />
    <app-local-number-field id="length-in-meters" label="Length In Meters:" fieldName="lengthInMeters" [formGroup]="dragonFormGroup()" [fieldControl]="dragonFormGroup().get('lengthInMeters')" />
    <app-local-number-field id="weight-in-kg" label="Weight In Kilograms:" fieldName="weightInKg" [formGroup]="dragonFormGroup()" [fieldControl]="dragonFormGroup().get('weightInKg')" />
    <app-local-select-field
      id="fighting-skills"
      label="Fighting Skills:"
      fieldName="fightingSkills"
      [formGroup]="dragonFormGroup()"
      [fieldControl]="dragonFormGroup().get('fightingSkills')"
      [options]="this.skillLevels" />
    <p-button type="submit" [disabled]="!dragonFormGroup().valid || isSubmitting()" [label]="isSubmitting() ? 'Submitting...' : 'Submit'" />
    @if (showSaved()) {
      <p-message severity="success" size="small" variant="simple">Saved</p-message>
    }
  </form>
</div>
