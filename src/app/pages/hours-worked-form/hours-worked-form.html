<h2>Hours Worked</h2>

<div class="card flex justify-center">
  <form [formGroup]="formGroup()" (ngSubmit)="onSubmit()" (focusin)="onFormFocus()">
    <app-local-string-date-field
      id="start-date"
      label="Start Date:"
      fieldName="workDateUnix"
      [formGroup]="formGroup()"
      [fieldControl]="formGroup().get('workDateUnix')" />
    <app-local-string-time-field
      id="start-date"
      label="Start Time:"
      fieldName="startDateTimeUnix"
      [formGroup]="formGroup()"
      [fieldControl]="formGroup().get('startDateTimeUnix')" />
    <app-local-string-time-field
      id="end-date"
      label="End Time:"
      fieldName="endDateTimeUnix"
      [formGroup]="formGroup()"
      [fieldControl]="formGroup().get('endDateTimeUnix')" />
    @if (totalHours() !== null) {
      <p>Total Hours: {{ totalHours() | number:'1.2-2' }}</p>
    }
    <app-local-submit-button
      [isSubmitDisabled]="!formGroup().valid || isSubmitting()"
      [isSubmitting]="isSubmitting()"
      [showSaved]="showSaved()"
      [submissionError]="submissionError()" />
  </form>
</div>
