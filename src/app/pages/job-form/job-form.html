<h2>Job Form</h2>

<div class="card flex justify-center">
  <form [formGroup]="formGroup()" (ngSubmit)="onSubmit()" (focusin)="onFormFocus()">
    <app-local-text-field id="job-title" label="Job Title:" fieldName="jobTitle" [formGroup]="formGroup()" [fieldControl]="formGroup().get('jobTitle')" />
    <app-local-text-field id="employer-name" label="Employer Name:" fieldName="employerName" [formGroup]="formGroup()" [fieldControl]="formGroup().get('employerName')" />
    <app-local-number-field id="number-of-positions" label="Number Of Positions:" fieldName="numberOfPositions" [formGroup]="formGroup()" [fieldControl]="formGroup().get('numberOfPositions')" />
    <app-local-date-field id="start-date" label="Start Date:" fieldName="startDate" [formGroup]="formGroup()" [fieldControl]="formGroup().get('startDate')" />
    <app-local-date-field id="end-date" label="End Date:" fieldName="endDate" [formGroup]="formGroup()" [fieldControl]="formGroup().get('endDate')" />
    <app-local-submit-button
      [isSubmitDisabled]="!formGroup().valid || isSubmitting()"
      [isSubmitting]="isSubmitting()"
      [showSaved]="showSaved()"
      [submissionError]="submissionError()" />
  </form>
</div>
