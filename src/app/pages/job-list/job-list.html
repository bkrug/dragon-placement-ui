<h3>Jobs</h3>

<div class="right-link"><span class="attention">⨮ </span><a href="/jobs-form">Create</a></div>
<p-table
  [value]="jobs()"
  [tableStyle]="{ 'min-width': '50rem' }"
  [paginator]="true"
  [rows]="this.pageSize"
  [totalRecords]="totalRecords()"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
  [showLoader]="true"
  [lazy]="true"
  (onLazyLoad)="onPageChange($event)"
  [selectionMode]="'single'"
  >
  <ng-template #header>
    <tr>
      <th></th>
      <th>Job Title</th>
      <th>Employer Name</th>
      <th>Positions to Fill</th>
      <th>Start Date</th>
      <th>End Date</th>
    </tr>
  </ng-template>
  <ng-template #body let-job>
    <tr>
      <td><a href="/jobs-form/{{ job.jobId }}">Edit</a></td>
      <td><a href="/jobs-manage/{{ job.jobId }}">{{ job.jobTitle }}</a></td>
      <td>{{ job.employerName }}</td>
      <td>{{ job.openDescription }}</td>
      <td>{{ job.startDate | date:'fullDate':'+0' }}</td>
      <td>{{ job.endDate | date:'fullDate':'+0' }}</td>
    </tr>
  </ng-template>
</p-table>
