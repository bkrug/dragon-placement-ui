<form [formGroup]="formGroup()" (ngSubmit)="onSubmit()" (focusin)="onFormFocus()">
  <input type="hidden" formControlName="dragonId" />
  <input type="hidden" formControlName="assignmentId" />
  <table class="date-display">
    <tr>
      <td>Dragon</td>
      <td>{{ dragonName() }}</td>
    </tr>
    <tr>
      <td>Assignment</td>
      <td>{{ assignmentDescription() }}</td>
    </tr>
    <tr>
      <td>Timesheet Period</td>
      <td>
        {{ minDate() }}
        to
        {{ maxDate() }}
      </td>
    </tr>
  </table>
  <p-table [value]="hoursWorkedRows()" [tableStyle]="{ 'min-width': '40rem' }">
    <ng-template #header>
      <tr>
        <th>Work Date</th>
        <th>Start Time</th>
        <th>End Time</th>
        <th>Total Hours</th>
        <th></th>
      </tr>
    </ng-template>
    <ng-template #body let-rowGroup let-i="rowIndex">
      <tr>
        <td>
          <app-local-string-date-field
            label=""
            fieldName="workDate"
            [formGroup]="rowGroup"
            [fieldControl]="rowGroup.get('workDate')"
            [min]="minDate()"
            [max]="maxDate()" />
        </td>
        <td>
          <app-local-string-time-field
            label=""
            fieldName="startDateTime"
            [formGroup]="rowGroup"
            [fieldControl]="rowGroup.get('startDateTime')" />
        </td>
        <td>
          <app-local-string-time-field
            label=""
            fieldName="endDateTime"
            [formGroup]="rowGroup"
            [fieldControl]="rowGroup.get('endDateTime')" />
        </td>
        <td>{{ getTotalHours(rowGroup) | number:'1.2-2' }}</td>
        <td><button type="button" (click)="removeRow(i)">Remove</button></td>
      </tr>
    </ng-template>
  </p-table>
  <button type="button" (click)="addRow()">Add Entry</button>
  <p>
    <app-local-submit-button
      [isSubmitDisabled]="!formGroup().valid || isSubmitting()"
      [isSubmitting]="isSubmitting()"
      [showSaved]="showSaved()"
      [submissionError]="submissionError()" />
  </p>
</form>
