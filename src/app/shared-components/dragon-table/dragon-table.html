@if (dragons().length === 0) {
  <span style="font-style: italic;">None</span>
}
@else {
  <p-table
    [value]="dragons()"
    [tableStyle]="{ 'min-width': '50rem' }"
    [paginator]="dragonTableType() !== DragonTableType.AlreadyAssigned && totalRecords() <= this.pageSize"
    [first]="this.first()"
    [rows]="this.pageSize"
    [totalRecords]="totalRecords()"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="Showing {first} to {last} of {totalRecords} entries"
    [showLoader]="true"
    [lazy]="true"
    (onLazyLoad)="onPageChange($event)"
    [(selection)]="selectedDragon"
    selectionMode="single"
    size="small"
    >
    <ng-template #header>
      <tr>
        <th [style.display]="dragonTableType() === DragonTableType.Candidates ? null : 'none'"></th>
        <th [style.display]="dragonTableType() === DragonTableType.AllDragons ? null : 'none'"></th>
        <th>Name</th>
        <th>Fighting Skills</th>
        <th>Weight (kg)</th>
        <th>Length (m)</th>
      </tr>
    </ng-template>
    <ng-template #body let-dragon>
      <tr [pSelectableRow]="dragon">
        <td [style.display]="dragonTableType() === DragonTableType.Candidates ? null : 'none'">
          <p-button (click)="assignDragon(dragon.dragonId)">Assign</p-button>
        </td>
        <td [style.display]="dragonTableType() === DragonTableType.AllDragons ? null : 'none'">
          <a [routerLink]="['/dragons-form', dragon.dragonId]">Edit</a>
        </td>
        <td><a [routerLink]="['/dragons', dragon.dragonId]">{{ dragon.givenName }} {{ dragon.familyName }}</a></td>
        <td>{{ dragon.fightingSkills }}</td>
        <td>{{ dragon.weightInKg }}</td>
        <td>{{ dragon.lengthInMeters }}</td>
      </tr>
    </ng-template>
  </p-table>
}
